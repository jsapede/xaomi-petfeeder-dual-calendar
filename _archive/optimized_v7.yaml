    on_press: 
      - script.execute: 
          id: dispense_food
          portions: !lambda return id(dispense_food_portions).state;
    name: "Dispense Food"
    icon: mdi:food-apple
  
  - platform: "miot"
    miot_siid: 8
    miot_aiid: 1
    name: "Reset Clean Timer"
    icon: mdi:restart
  
  - platform: "miot"
    miot_siid: 11
    miot_aiid: 1
    name: "Reset Dessicant Timer"
    icon: mdi:restart

  - platform: template
    name: "Reset Daily Total"
    id: reset_daily_total
    icon: mdi:counter
    on_press:
      - lambda: |-
          int target = (int)id(daily_total_reset).state;
          id(portions_dispensed_today) = target;
          id(dispensed_today).publish_state((float)target);
          ESP_LOGI("feed", "Daily total reset to %d", target);

event:
  - platform: "template"
    name: 'Feed Event'
    id: feed_event
    event_types:
      - 'start'
      - 'stats'
      - 'success'
    icon: mdi:food-apple
  
  # Feed success event - triggered when MCU completes feeding
  - platform: "miot"
    miot_siid: 4
    miot_eiid: 1
    id: feedsuccess_event
    event_type: feedsuccess
    internal: true
    on_event:
      - event.trigger:
          id: feed_event
          event_type: "success"
      - lambda: |-
          if (id(pending_feed_id) >= 0) {
            // === ESP SCHEDULE MODE ===
            int exp = id(pending_feed_time);
            int now = id(homeassistant_time).now().hour * 60 + id(homeassistant_time).now().minute;
            int diff = abs(now - exp);
            if (diff <= 1) {
              ESP_LOGI("verify", "=== TIMING OK ===");
              id(last_feed_success) = true;
              id(feed_success).publish_state(true);
            } else {
              ESP_LOGW("verify", "=== TIMING FAIL ===");
              id(last_feed_success) = false;
              id(feed_success).publish_state(false);
            }
            // Update ESP schedule status
            int fid = id(pending_feed_id);
            int h = id(schedule)[fid][0];
            int m = id(schedule)[fid][1];
            int p = id(schedule)[fid][2];
            id(schedule)[fid] = {h, m, p, 0};
            // Update card
            id(raw_feed_plan).update();
            // Set source explicitly (ESP mode)
            id(last_feed_source).publish_state(str_sprintf("ESP Schedule %d", fid));
            // Increment daily total (ESP mode)
            int new_total = id(portions_dispensed_today) + p;
            id(portions_dispensed_today) = new_total;
            ESP_LOGI("feed", "Daily total: %d portions", new_total);
            // Clear ESP mode flag
            id(pending_feed_id) = -1;
          } else {
            // === MCU SCHEDULE MODE ===
            ESP_LOGI("feed", "=== MCU MODE ===");
            // Read feedplan from MCU (MCU will update card and total)
            id(refresh_feed_plan).execute();
          }
      - component.update:
          id: dispensed_today
  
  # Feed stats event
  - platform: "miot"
    miot_siid: 4
    miot_eiid: 2
    id: feedstats_event
    event_type: feedstats
    internal: true
    on_event:
      - event.trigger:
          id: feed_event
          event_type: "stats"
  
  # Feed start event
  - platform: "miot"
    miot_siid: 4
    miot_eiid: 3
    id: feedstart_event
    event_type: feedstart
    internal: true
    on_event:
      - lambda: |-
          ESP_LOGI("feed", "=== FEED START EVENT ===");
          // In ESP mode, DON'T refresh from MCU - success event will manage status
          // In MCU mode, DON'T refresh here - let success event handle it
      - event.trigger:
          id: feed_event
          event_type: "start"
  
  # Power loss event
  - platform: "miot"
    miot_siid: 9
    miot_eiid: 1
    id: power_loss
    name: "Power Loss"
    event_type: power_loss
    icon: mdi:power-plug-off

